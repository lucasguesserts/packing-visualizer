<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Packing Visualizer</title>
    <style>
        body {
            margin: 0;
        }

        .slidecontainer {
            width: 100%;
            /* Width of the outside container */
        }

        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 15px;
            border-radius: 5px;
            background: #d3d3d3;
            outline: none;
            opacity: 0.7;
            -webkit-transition: .2s;
            transition: opacity .2s;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #04AA6D;
            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #04AA6D;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <label for="draw-file-selector">Load Output</label>
    <input type="file" id="draw-file-selector" accept=".json">

    <label for="check-input-file-selector">Check Input</label>
    <input type="file" id="check-input-file-selector" accept=".json">

    <div class="slidecontainer">
        <input type="range" min="0" max="0" value="50" class="slider" id="slideRange">
    </div>

    <script type="module" src="/src/main.mjs"></script>
</body>

</html>
